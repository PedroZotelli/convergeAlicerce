name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: release gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install validation and host prerequisites
        run: |
          python -m pip install --disable-pip-version-check jsonschema==4.25.1
          if ! command -v shellcheck >/dev/null 2>&1; then
            if [ "$RUNNER_OS" = macOS ]; then brew install shellcheck; else sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck; fi
          fi
          npm ci --prefix apps/cockpit
      - name: Install exact external engines
        run: |
          taskspec_dir="$(mktemp -d -t task-spec-engine.XXXXXX)"
          seamwise_dir="$(mktemp -d -t seamwise-engine.XXXXXX)"
          git clone --quiet https://github.com/PedroZotelli/task-specAlicerce.git "$taskspec_dir"
          git -C "$taskspec_dir" checkout --quiet --detach c7973304a3ab1cf952ca3843f6db4db29f245c30
          bash "$taskspec_dir/install.sh" --global --copy
          git clone --quiet https://github.com/PedroZotelli/seamwiseAlicerce.git "$seamwise_dir"
          git -C "$seamwise_dir" checkout --quiet --detach 862a90ad38a37a250af2d96c0fc2c3c2f8149519
          python -m pip install --disable-pip-version-check "$seamwise_dir"
          {
            printf 'PATH=%s/.local/bin:%s\n' "$HOME" "$PATH"
            printf 'CVG_TASKSPEC_BIN=%s/.local/bin/taskspec\n' "$HOME"
            printf 'CVG_SEAMWISE_BIN=%s\n' "$(command -v seamwise)"
            printf 'CVG_TASKSPEC_SOURCE_ROOT=%s\n' "$taskspec_dir"
            printf 'CVG_SEAMWISE_SOURCE_ROOT=%s\n' "$seamwise_dir"
            printf 'COMPOSE_DEMO_REQUIRE_ENGINE_PROVENANCE=1\n'
          } >> "$GITHUB_ENV"
      - name: Run complete release boundary
        run: make release-check PYTHON=python

  build:
    name: build release assets
    runs-on: ubuntu-latest
    needs: verify
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Read the version once, for every later job
        id: version
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          case "$version" in
            ""|*[!0-9A-Za-z.+-]*) echo "::error::VERSION is not a version: '$version'"; exit 1 ;;
          esac
          if [[ "$GITHUB_REF_TYPE" = tag ]]; then test "$GITHUB_REF_NAME" = "v$version"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Assemble stable assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          version="$VERSION"
          # A release ships only with its own retained evidence; without it, stop here.
          test -d "evidence/releases/v$version" || { echo "::error::no retained release evidence at evidence/releases/v$version"; exit 1; }
          mkdir -p dist release-assets
          package="$(npm pack --pack-destination dist --silent)"
          python scripts/release-assets.py \
            --package "dist/$package" \
            --evidence "evidence/releases/v$version" \
            --out release-assets \
            --source-commit "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF_NAME" \
            --ci-run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: converge-release-assets
          path: release-assets/
          if-no-files-found: error

  publish:
    name: publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: converge-release-assets
          path: release-assets
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          # This job has no checkout: the version comes from the build job, not from a file.
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          test -n "$VERSION" || { echo "::error::the build job did not report a version"; exit 1; }
          test "$GITHUB_REF_NAME" = "v$VERSION" || { echo "::error::tag $GITHUB_REF_NAME is not v$VERSION"; exit 1; }
          gh release create "v$VERSION" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Converge $VERSION" \
            --generate-notes \
            --verify-tag
